<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1500">
  <!-- To/From shipping label, kraft-box style. MailLabel.css crops this canvas to the label
       (x 211–1289, y 359–1141) and writes the names on the lines, so keep those positions. -->
  <rect x="223" y="373" width="1066" height="768" rx="44" fill="#B9895A"/>
  <rect x="211" y="359" width="1066" height="768" rx="44" fill="#D9AA76"/>
  <rect x="251" y="399" width="986" height="688" rx="26" fill="#FBF4E6"/>
  <rect x="279" y="427" width="930" height="632" rx="16" fill="none" stroke="#E3CDA8" stroke-width="5" stroke-dasharray="22 16"/>

  <g font-family="'Segoe UI', system-ui, sans-serif" font-weight="700" font-size="58" letter-spacing="6" fill="#8E6340">
    <text x="330" y="520">TO:</text>
    <text x="330" y="860">FROM:</text>
  </g>

  <g stroke="#D9AA76" stroke-width="6" stroke-linecap="round">
    <line x1="609" y1="536" x2="1160" y2="536"/>
    <line x1="609" y1="659" x2="1160" y2="659"/>
    <line x1="609" y1="876" x2="1160" y2="876"/>
    <line x1="609" y1="999" x2="1160" y2="999"/>
  </g>

  <path transform="translate(1176 1036) scale(1.6)" d="M0 8 C-14 -2 -12 -14 -5 -14 C-2 -14 0 -11 0 -9 C0 -11 2 -14 5 -14 C12 -14 14 -2 0 8 Z" fill="#E0607E"/>
</svg>
